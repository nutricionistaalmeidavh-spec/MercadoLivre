<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OAuth Mercado Livre</title>
<style>body{font-family:system-ui;background:#f4f7fb;margin:0;color:#0f172a}.card{max-width:680px;margin:70px auto;background:white;border:1px solid #e2e8f0;border-radius:18px;padding:28px}.brand{color:#12623a;font-weight:900}.msg{padding:14px;border-radius:10px;background:#dbeafe;color:#1e40af;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}a{display:inline-block;margin-top:15px;padding:12px 16px;border-radius:10px;background:#12623a;color:#fff;text-decoration:none;font-weight:800}</style></head>
<body><div class="card"><div class="brand">ARTISYS • MERCADO LIVRE</div><h1>Autorização Mercado Livre</h1><div id="m" class="msg">Processando autorização...</div><a id="go" href="/admin" style="display:none">Voltar ao painel</a></div>
<script>
(async()=>{const q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state'),error=q.get('error'),m=document.getElementById('m'),go=document.getElementById('go');if(error){m.className='msg err';m.textContent='Autorização negada: '+error;return}if(!code){m.className='msg err';m.textContent='Nenhum código OAuth foi recebido.';return}try{const r=await fetch('/api/oauth?op=exchange',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({code,state})});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={error:raw||'Resposta inválida'}}if(!r.ok){const detail=d.details&&typeof d.details==='object'?d.details:{};const lines=[d.error||'Falha no OAuth'];if(detail.error)lines.push('Mercado Livre: '+String(detail.error));if(detail.error_description)lines.push(String(detail.error_description));if(detail.message&&detail.message!==detail.error_description)lines.push(String(detail.message));lines.push('HTTP '+r.status);throw new Error(lines.join('\n'))}m.className='msg ok';m.textContent='Mercado Livre conectado com sucesso. Você já pode voltar ao painel.';go.style.display='inline-block'}catch(e){m.className='msg err';m.textContent=e.message}})()
</script></body></html>
