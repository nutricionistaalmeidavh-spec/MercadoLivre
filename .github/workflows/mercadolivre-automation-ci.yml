name: MercadoLivre Automation CI

on:
  push:
    branches:
      - feature/mercadolivre-automation-v1
      - feature/mobile-dashboard-ads-v1
  pull_request:
    paths:
      - "api/**"
      - "src/**"
      - "cloudflare/**"
      - "test/**"
      - "tests/**"
      - "scripts/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".assetsignore"
      - "admin-cloudflare.html"
      - "license-center.html"
      - "license-center.js"
      - "mercadolivre/**"
      - "DESIGN.md"
      - "UX-CONTRACT.md"
      - ".github/workflows/mercadolivre-automation-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Isolated license center E2E
        run: npm run qa:license-center:isolated
      - name: Upload license center QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadolivre-license-center-qa-${{ github.run_number }}
          path: qa-artifacts/license-center-isolated/
          if-no-files-found: warn
          retention-days: 14
      - name: Design context lint
        run: npx -y -p @google/design.md designmd lint DESIGN.md
