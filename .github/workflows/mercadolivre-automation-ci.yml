name: MercadoLivre Automation CI

on:
  push:
    branches:
      - feature/mercadolivre-automation-v1
  pull_request:
    paths:
      - "api/**"
      - "src/**"
      - "cloudflare/**"
      - "scripts/**"
      - "tests/**"
      - "server.js"
      - "package.json"
      - ".assetsignore"
      - "migration.html"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/migrate-all-to-cloudflare.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Tests
        run: npm test
