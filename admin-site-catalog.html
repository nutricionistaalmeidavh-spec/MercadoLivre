<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo ArtiSys · Mercado Livre</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecf4ff;background:#07111f;--line:rgba(255,255,255,.12);--muted:#98aac2;--accent:#55d6a8;--card:#0d1a2a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(85,214,168,.12),transparent 30rem),#07111f}a{color:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 64px}.top{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:26px}.top a{text-decoration:none;color:var(--muted)}h1{margin:0;font-size:clamp(2rem,7vw,4.5rem);letter-spacing:-.05em}.lead{max-width:760px;color:var(--muted);line-height:1.65}.status{margin:20px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;color:var(--muted)}.grid{display:grid;gap:16px}.item{border:1px solid var(--line);border-radius:24px;background:var(--card);overflow:hidden}.media{display:flex;gap:8px;overflow:auto;padding:14px;border-bottom:1px solid var(--line)}.media img{width:112px;height:112px;object-fit:cover;border-radius:14px;background:#101f32}.body{padding:18px}.headline{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.headline h2{margin:0;font-size:1.15rem}.meta{color:var(--muted);font-size:.82rem;margin-top:5px}.badge{font-size:.72rem;font-weight:800;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07)}.badge.live{background:rgba(85,214,168,.15);color:#8cf0cc}.controls{display:grid;gap:12px;margin-top:18px}.row{display:grid;gap:10px}.field{display:grid;gap:6px}.field span{font-size:.74rem;color:var(--muted);font-weight:700}.field input,.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:#07111f;color:#fff;padding:0 11px}.checks{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:.84rem}.checks label{display:flex;gap:7px;align-items:center}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.button{border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:#04130e;font-weight:850;cursor:pointer}.button.secondary{background:transparent;color:#dce7f3;border:1px solid var(--line);text-decoration:none}.button:disabled{opacity:.45;cursor:wait}.error{color:#ffaaa4}.ok{color:#8cf0cc}@media(min-width:760px){.row{grid-template-columns:1.1fr .8fr .8fr .8fr}.controls .row:first-child{grid-template-columns:1fr 1fr}.body{padding:22px}.media img{width:132px;height:132px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><a href="/admin?view=mais">← Voltar ao painel</a><a href="https://artisys.dev/sistemas/" target="_blank" rel="noopener noreferrer">Abrir catálogo ArtiSys ↗</a></div>
    <p class="meta">Mercado Livre → ArtiSys</p>
    <h1>Aprovação do catálogo</h1>
    <p class="lead">Os anúncios aparecem aqui automaticamente, mas nenhum entra no site até você marcar <strong>Aprovado para o site</strong> e salvar. Fotos, preço, link e vendas vêm do anúncio atual do Mercado Livre.</p>
    <div id="catalog-status" class="status">Carregando anúncios…</div>
    <section id="catalog-list" class="grid" aria-live="polite"></section>
  </main>
  <script src="/admin-site-catalog.js" defer></script>
</body>
</html>
